{% extends 'lost_ark/base_extension.html' %}

{% block content %}
    <div class="container" style="padding-top: 80px; padding-bottom: 80px;">
        <div class="row">
            <div class="col-md-6 mx-auto">
                <div class="card bg-dark border-light">
                    <div class="card-body">
                        <h3 class="card-title">
                            {% if object %}Edit{% else %}Add{% endif %} Character
                        </h3>
                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <input type="hidden" name="next" value="{{ next }}">
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                <!-- Cancel button with dynamic 'next' URL -->
                                <a href="{{ next }}" class="btn btn-outline-light me-md-2">
                                    Cancel
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    {% if object %}Update{% else %}Create{% endif %}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
